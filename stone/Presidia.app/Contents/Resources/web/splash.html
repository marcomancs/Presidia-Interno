<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presidia</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: transparent;                 /* finestra frameless+trasparente → angoli stondati reali */
    font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-user-select:none; user-select:none;
    cursor: default;
  }
  /* la "card" è la finestra visibile: margine ampio (44px) così l'ombra non viene mai tagliata */
  .card {
    position:absolute; inset:44px;
    border-radius:24px; overflow:hidden;
    background:
      radial-gradient(90% 80% at 50% 38%, #ffffff 0%, rgba(255,255,255,0) 70%),
      linear-gradient(160deg, #f7f9fc 0%, #e9eff5 100%);
    /* ombra a strati: contatto + diffusa, tutta contenuta nel margine della finestra */
    box-shadow:
      0 1px 2px rgba(16,61,94,.10),
      0 6px 14px rgba(16,61,94,.10),
      0 16px 30px rgba(16,61,94,.10);
    display:flex; align-items:center; justify-content:center;
    animation: fadein .5s ease both, lift .7s cubic-bezier(.22,.9,.32,1) both;
  }
  /* filo di luce interno + alone morbido dietro il logo */
  .card::before {
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.9), inset 0 -18px 30px rgba(16,61,94,.04);
  }
  .glow {
    position:absolute; width:260px; height:160px; left:50%; top:46%; transform:translate(-50%,-50%);
    background: radial-gradient(closest-side, rgba(42,127,184,.20), rgba(42,127,184,0));
    animation: breathe 3s ease-in-out infinite alternate; pointer-events:none;
  }
  /* riflesso luminoso che attraversa la card */
  .sheen {
    position:absolute; top:-20%; bottom:-20%; width:34%; left:-50%; pointer-events:none;
    background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.65) 50%, rgba(255,255,255,0) 100%);
    transform: skewX(-18deg); animation: sheen 2.6s ease-in-out .5s infinite;
  }
  #logo {
    position:relative; width:210px; max-width:58%; height:auto; display:block;
    animation: rise .8s cubic-bezier(.22,.9,.32,1) both;
    -webkit-user-drag:none;
  }
  /* barra di caricamento: binario arrotondato staccato dai bordi */
  .bar {
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    width:120px; height:4px; border-radius:99px; overflow:hidden; background: rgba(16,61,94,.10);
  }
  .bar::before {
    content:""; position:absolute; top:0; bottom:0; left:-45%; width:45%; border-radius:99px;
    background: linear-gradient(90deg, #103D5E, #2a7fb8);
    animation: slide 1.25s cubic-bezier(.65,0,.35,1) infinite;
  }
  /* Windows: la finestra È la card (424x264, angoli stondati dalla regione Win32) */
  body.win { background:#eef2f6; }
  body.win .card { inset:0; border-radius:0; box-shadow: inset 0 0 0 1px rgba(16,61,94,.14); animation: fadein .45s ease both; }
  body.win .card::before { display:none; }
  @keyframes lift { from{ transform: translateY(8px) scale(.985); } to{ transform:none; } }
  @keyframes breathe { from{ opacity:.55; transform:translate(-50%,-50%) scale(.95); } to{ opacity:1; transform:translate(-50%,-50%) scale(1.08); } }
  @keyframes sheen { 0%{ left:-50%; } 60%,100%{ left:130%; } }
  @keyframes fadein { from{opacity:0} to{opacity:1} }
  @keyframes rise {
    from{ opacity:0; transform: translateY(10px) scale(.985); }
    to  { opacity:1; transform: translateY(0)    scale(1);     }
  }
  @keyframes slide { 0%{ left:-45%; } 100%{ left:100%; } }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <img id="logo" src="Logo_stone.png" alt="Stone Safety">
    <div class="sheen"></div>
    <div class="bar"></div>
  </div>
<script>if (/Windows/i.test(navigator.userAgent)) document.body.classList.add('win');</script>
</body>
</html>
